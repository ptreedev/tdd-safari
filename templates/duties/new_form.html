<form action="/duties" method="post">
    <p>
        <label>
            Name:
            <input name="name" required>
        </label>
    </p>
    <p>
        <label>
            Description:
            <input name="description" required>
        </label>
    </p>
    <div class="dialog-actions">
        <a href="/duties">
            Cancel
        </a>
        <button type="submit">Create</button>
    </div>
</form>
